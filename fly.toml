app = "tcdd-telegram"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  TIMEZONE = "Europe/Istanbul"
  LOG_LEVEL = "INFO"
  CHECK_INTERVAL_MIN = "5"

# Long-running poller: always restart it. The default on-failure/max_retries=10
# policy would stop the bot permanently after 10 crashes.
[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
