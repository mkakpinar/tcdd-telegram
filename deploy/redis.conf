# Redis config for the bot's state (users, alarms, rate limits).

bind 0.0.0.0
protected-mode no          # only reachable on the compose-private network
port 6379

# Alarms must survive a restart, so persist rather than run as a cache.
appendonly yes
appendfsync everysec
dir /data

# Small dataset (a handful of alarms per user). The cap is a safety net against
# runaway growth; noeviction means a full instance fails writes loudly instead
# of silently dropping someone's alarm.
maxmemory 48mb
maxmemory-policy noeviction

save 900 1
save 300 10
