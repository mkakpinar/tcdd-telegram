# Pinned production dependencies for reproducible Docker builds.
#
# Captured from the known-good resolution that was running in prod:
#   fly ssh console -a tcdd-telegram -C "pip freeze"
# (dropping the `tcdd-telegram @ file:///app` self-line). The Dockerfile installs
# these first, then the app itself with `--no-deps`, so an upstream release can no
# longer silently change what ships between deploys. CI (test.yml) still does a
# fresh `pip install -e '.[dev]'`, so it doubles as a forward-compat canary
# against newer dependency versions.
#
# Regenerate whenever pyproject.toml's dependency bounds change (resolve in a
# clean venv or read it back off a fresh prod deploy, then repin here).
