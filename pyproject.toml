[project]
name = "tcdd-telegram"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter]>=21.6",
    "httpx>=0.27",
    "upstash-redis>=1.2",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
