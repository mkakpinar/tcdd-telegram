# Redis config for the bot's state (users, alarms, rate limits).
#
# Note: Redis has no trailing comments — a `#` after a directive is parsed as
# another argument and aborts startup. Every comment gets its own line.

bind 0.0.0.0

# No port is published to the host, so this is only reachable from the bot
# container on the stack's private network.
protected-mode no
port 6379

# Alarms must survive a restart, so persist rather than run as a cache.
appendonly yes
appendfsync everysec
dir /data

# Small dataset (a handful of alarms per user). The cap is a safety net against
# runaway growth; noeviction means a full instance fails writes loudly instead
# of silently dropping someone's alarm.
maxmemory 48mb
maxmemory-policy noeviction

save 900 1
save 300 10
