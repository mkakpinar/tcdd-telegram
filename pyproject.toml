[project]
name = "tcdd-telegram"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot[rate-limiter,job-queue]>=22.8",
    "httpx>=0.28.1",
    "redis[hiredis]>=5.0",
    "rapidfuzz>=3.14.5",
    "python-dotenv>=1.2.2",
    "curl_cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0",
    "fakeredis>=2.36.2",
    "ruff>=0.6",
    "bandit>=1.9.4",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's concern, not a lint gate

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Ratchet just below the current ~67% so testable logic can't silently regress.
fail_under = 60
