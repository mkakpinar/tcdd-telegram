name: tcdd active window

# Scale tcdd to zero during the dead-of-night hours (no meaningful TCDD departures
# 00:00–06:00 Istanbul) to save Fly compute — a stopped machine bills nothing.
# tcdd has no HTTP server, so Fly's idle auto-stop can't gate it; we stop/start the
# machine on a schedule instead.
#
# Active window: 03:00–21:00 UTC (= 06:00–00:00 Europe/Istanbul; Turkey has no DST).
# The alarm checker is an interval job (run_repeating), so it simply resumes on each
# wake — nothing else to realign. Requires a repo secret FLY_API_TOKEN with access
# to the app (fly tokens create deploy -a tcdd-telegram).
#
# Reliability: START runs hourly and is idempotent, so a skipped/late GitHub cron
# tick self-heals next hour. STOP fires twice (21:00 + 22:00 UTC) so a missed stop
# costs ~1h, not the whole night.

on:
  schedule:
    - cron: '0 3-20 * * *'    # hourly 03:00–20:00 UTC -> ensure STARTED
    - cron: '0 21,22 * * *'   # 21:00 & 22:00 UTC -> STOP (backstopped)
  workflow_dispatch:
    inputs:
      action:
        description: Manually start or stop the machine
        type: choice
        options: [start, stop]
        default: start

concurrency:
  group: tcdd-window
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: tcdd-telegram
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve the single machine id
        id: mid
        run: echo "id=$(flyctl machines list -a "$FLY_APP" --json | jq -r '.[0].id')" >> "$GITHUB_OUTPUT"

      - name: Start (ensure up during the active window)
        if: github.event.schedule == '0 3-20 * * *' || github.event.inputs.action == 'start'
        run: flyctl machine start "${{ steps.mid.outputs.id }}" -a "$FLY_APP"

      - name: Stop (scale to zero overnight)
        if: github.event.schedule == '0 21,22 * * *' || github.event.inputs.action == 'stop'
        run: flyctl machine stop "${{ steps.mid.outputs.id }}" -a "$FLY_APP"
